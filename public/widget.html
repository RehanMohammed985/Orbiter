<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>news</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --text:#e0e0ec;
  --dim:#555580;
  --muted:#282840;
  --gold:#fbbf24;
  --gold-glow:rgba(251,191,36,0.08);
  --cyan:#22d3ee;
  --green:#4ade80;
  --magenta:#f472b6;
  --violet:#a78bfa;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  background:#000;
  background-image:radial-gradient(ellipse at 50% 100%, rgba(88,28,135,0.04) 0%, transparent 60%),
                    radial-gradient(ellipse at 20% 0%, rgba(14,116,144,0.02) 0%, transparent 50%);
  color:var(--text);
  font-size:13.5px;
  line-height:1.5;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  padding:40px 44px 20px;
  position:relative;
}

/* ── Stars ── */

#stars{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  border-radius:50%;
  background:#fff;
  animation:twinkle var(--d,4s) ease-in-out infinite alternate;
}

@keyframes twinkle{
  0%{opacity:var(--o1,0.1);transform:scale(0.6)}
  100%{opacity:var(--o2,0.7);transform:scale(1.1)}
}

/* ── Meteors ── */

.meteor{
  position:fixed;
  left:100%;
  width:200px;
  height:1.5px;
  background:linear-gradient(to right, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.2) 12%, rgba(255,255,255,0.05) 30%, transparent 100%);
  border-radius:1px;
  pointer-events:none;
  z-index:0;
  opacity:0;
}

.meteor::before{
  content:'';
  position:absolute;
  left:-3px;
  top:-3px;
  width:7px;
  height:7px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 6px rgba(255,255,255,0.5),0 0 20px rgba(255,255,255,0.12),0 0 40px rgba(255,255,255,0.04);
}

.meteor-1{top:6%;animation:m1 20s ease-out infinite}
.meteor-2{top:16%;animation:m2 26s ease-out infinite 7s}
.meteor-3{top:10%;animation:m3 22s ease-out infinite 14s}
.meteor-4{top:20%;animation:m4 28s ease-out infinite 5s}

@keyframes m1{
  0%{transform:translate(55vw,-18vh);opacity:0}
  3%{opacity:1}
  9%{transform:translate(-140vw,15vh);opacity:0}
  100%{transform:translate(-140vw,15vh);opacity:0}
}

@keyframes m2{
  0%{transform:translate(45vw,-12vh);opacity:0}
  2%{opacity:1}
  7%{transform:translate(-150vw,22vh);opacity:0}
  100%{transform:translate(-150vw,22vh);opacity:0}
}

@keyframes m3{
  0%{transform:translate(60vw,-22vh);opacity:0}
  2.5%{opacity:1}
  8%{transform:translate(-130vw,25vh);opacity:0}
  100%{transform:translate(-130vw,25vh);opacity:0}
}

@keyframes m4{
  0%{transform:translate(50vw,-10vh);opacity:0}
  2%{opacity:1}
  7%{transform:translate(-120vw,18vh);opacity:0}
  100%{transform:translate(-120vw,18vh);opacity:0}
}

/* ── Live Alert ── */

.live-alert{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  pointer-events:none;
  transform:translateY(-100%);
  transition:transform 0.5s cubic-bezier(0.22,1,0.36,1),opacity 0.4s ease;
  opacity:0;
  padding:16px 44px;
  text-align:center;
}

.live-alert.visible{
  transform:translateY(0);
  opacity:1;
}

.live-alert-inner{
  display:inline-flex;
  align-items:center;
  gap:12px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(251,191,36,0.1);
  border-top:none;
  border-radius:0 0 14px 14px;
  padding:10px 24px 10px 20px;
  box-shadow:0 8px 40px rgba(0,0,0,0.4),0 0 60px rgba(251,191,36,0.03);
}

.live-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 10px var(--gold-glow);
  animation:pulse 1.5s ease-in-out infinite;
  flex-shrink:0;
}

@keyframes pulse{
  0%,100%{opacity:0.5;transform:scale(0.8)}
  50%{opacity:1;transform:scale(1.2)}
}

.live-label{
  font-size:10px;
  font-weight:600;
  color:var(--gold);
  letter-spacing:0.1em;
  text-transform:uppercase;
  flex-shrink:0;
}

.live-title{
  font-size:13px;
  color:var(--text);
  font-weight:450;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:420px;
}

.live-source{
  font-size:10px;
  color:var(--dim);
  flex-shrink:0;
  letter-spacing:0.04em;
}

/* ── Clock ── */

.clock-section{
  text-align:center;
  margin-bottom:36px;
  user-select:none;
  flex-shrink:0;
  position:relative;
  z-index:1;
}

.clock-time{
  font-family:'SF Mono','Fira Code','JetBrains Mono','Consolas',monospace;
  font-size:44px;
  font-weight:600;
  color:var(--gold);
  letter-spacing:0.06em;
  font-feature-settings:'tnum';
  text-shadow:0 0 60px var(--gold-glow),0 0 120px var(--gold-glow),0 0 200px rgba(251,191,36,0.03);
  line-height:1;
  margin-bottom:6px;
}

.clock-date{
  font-size:11px;
  color:var(--dim);
  letter-spacing:0.3em;
  text-transform:uppercase;
  font-weight:450;
}

/* ── Controls ── */

.controls{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:24px;
  flex-shrink:0;
  position:relative;
  z-index:1;
}

.filters{display:flex;gap:4px}

.f-btn{
  background:none;
  border:none;
  color:var(--dim);
  font-family:inherit;
  font-size:12.5px;
  padding:5px 16px;
  cursor:pointer;
  border-radius:8px;
  transition:all 0.2s;
  font-weight:450;
  letter-spacing:0.02em;
}

.f-btn:hover{color:var(--text);background:rgba(255,255,255,0.03)}
.f-btn.active{color:var(--cyan);background:rgba(34,211,238,0.06);text-shadow:0 0 20px rgba(34,211,238,0.08)}

.ctrl-fill{flex:1}

.story-count{
  color:var(--dim);
  font-size:11px;
  font-feature-settings:'tnum';
  letter-spacing:0.06em;
  font-weight:450;
}

/* ── Stories ── */

main{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;z-index:1}
.list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  text-decoration:none;
  border-radius:10px;
  transition:all 0.2s;
  margin-bottom:2px;
  position:relative;
}

.item:hover{background:rgba(255,255,255,0.025)}

.item:hover::before{
  content:'';
  position:absolute;
  left:2px;
  top:6px;
  bottom:6px;
  width:2px;
  background:linear-gradient(to bottom, transparent, var(--gold), transparent);
  border-radius:1px;
  opacity:0.35;
}

.item-time{
  font-family:'SF Mono','Fira Code','JetBrains Mono','Consolas',monospace;
  color:var(--dim);
  font-size:12px;
  font-feature-settings:'tnum';
  width:44px;
  flex-shrink:0;
  text-align:right;
}

.item-source{
  font-size:10.5px;
  font-weight:500;
  color:var(--cyan);
  width:80px;
  flex-shrink:0;
  letter-spacing:0.04em;
  opacity:0.45;
  text-transform:uppercase;
  transition:opacity 0.2s;
}

.item:hover .item-source{opacity:1}

.item-title{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--text);
  font-size:13.5px;
  font-weight:400;
  transition:color 0.2s;
}

.item:hover .item-title{color:var(--gold)}

.item-tags{
  display:flex;
  gap:5px;
  flex-shrink:0;
}

.tag{
  font-size:9.5px;
  font-weight:500;
  padding:2px 8px;
  border-radius:4px;
  letter-spacing:0.04em;
}

.t-cs{color:var(--violet);background:rgba(167,139,250,0.07)}
.t-ai{color:var(--cyan);background:rgba(34,211,238,0.07)}
.t-ml{color:var(--green);background:rgba(74,222,128,0.07)}
.t-sp{color:var(--magenta);background:rgba(244,114,182,0.07)}

.item.new{animation:appear 0.4s ease}
@keyframes appear{
  from{opacity:0;transform:translateY(-8px) scale(0.98);filter:blur(3px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

/* ── Day Headers ── */

.day-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 14px 6px;
  font-size:10px;
  font-weight:600;
  color:var(--dim);
  letter-spacing:0.12em;
  text-transform:uppercase;
}

.day-header::before,.day-header::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(to right, transparent, var(--muted), transparent);
}

.day-header::before{flex:none;width:16px;background:var(--gold);opacity:0.25;border-radius:1px}
.day-header::after{opacity:0.3}

/* ── Breaking Hero ── */

.hero{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  padding:0 0 8px;
  margin-bottom:6px;
  flex-shrink:0;
  position:relative;
  z-index:1;
  min-height:0;
}

.hero:empty{display:none}

.hero-card{
  position:relative;
  padding:18px 22px;
  border-radius:12px;
  background:rgba(255,255,255,0.015);
  border:1px solid rgba(251,191,36,0.08);
  text-decoration:none;
  transition:all 0.2s;
  cursor:pointer;
}

.hero-card:hover{
  background:rgba(255,255,255,0.03);
  border-color:rgba(251,191,36,0.2);
}

.hero-card .item-title{
  font-size:14px;
  font-weight:500;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hero-card-bottom{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.hero-tag{
  font-size:9.5px;
  padding:1px 7px;
  border-radius:3px;
  letter-spacing:0.04em;
  font-weight:500;
}
.ht-cs{color:var(--violet);background:rgba(167,139,250,0.06)}
.ht-ai{color:var(--cyan);background:rgba(34,211,238,0.06)}
.ht-ml{color:var(--green);background:rgba(74,222,128,0.06)}
.ht-sp{color:var(--magenta);background:rgba(244,114,182,0.06)}

.hero-src{
  font-size:9.5px;
  color:var(--cyan);
  opacity:0.4;
  letter-spacing:0.04em;
  text-transform:uppercase;
  font-weight:500;
}

.hero-badge{
  font-size:8px;
  font-weight:600;
  color:var(--gold);
  letter-spacing:0.08em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:5px;
}

.hero-badge::before{
  content:'';
  width:4px;height:4px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 6px var(--gold-glow);
}

/* ── Hero Preview ── */

.hero-preview{
  position:absolute;
  bottom:calc(100% + 10px);
  left:0;right:0;
  background:rgba(0,0,0,0.78);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:10px;
  padding:14px 16px;
  font-size:12px;
  line-height:1.55;
  color:var(--text);
  pointer-events:none;
  opacity:0;
  transform:translateY(6px) scale(0.96);
  transition:all 0.25s cubic-bezier(0.22,1,0.36,1);
  box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 60px rgba(34,211,238,0.02);
  z-index:20;
}

.hero-card:hover .hero-preview{
  opacity:1;
  transform:translateY(0) scale(1);
}

.hero-preview::before{
  content:'';
  position:absolute;
  top:0;left:14px;right:14px;
  height:1px;
  background:linear-gradient(to right, transparent, rgba(34,211,238,0.3), transparent);
}

.hero-preview-head{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

.hero-preview-head::before{
  content:'';
  width:3px;height:3px;
  background:var(--cyan);
  border-radius:50%;
  box-shadow:0 0 6px rgba(34,211,238,0.5);
  flex-shrink:0;
}

.hero-preview-label{
  font-size:8px;
  font-weight:600;
  color:var(--cyan);
  letter-spacing:0.12em;
  text-transform:uppercase;
  opacity:0.7;
}

/* ── Status ── */

.status-bar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px 0;
  margin-top:10px;
  position:relative;
  z-index:1;
}

.fetch-status{
  color:rgba(251,191,36,0.65);
  font-family:'SF Mono','Fira Code','JetBrains Mono','Consolas',monospace;
  font-size:10px;
  font-feature-settings:'tnum';
  display:flex;
  align-items:center;
  gap:5px;
}

.fetch-status::before{
  content:'';
  width:5px;height:5px;
  border-radius:50%;
  background:#4ade80;
  flex-shrink:0;
  animation:live-pulse 1.5s ease-in-out infinite;
}

@keyframes live-pulse{
  0%,100%{opacity:0.4;transform:scale(0.7);box-shadow:0 0 0 rgba(74,222,128,0)}
  50%{opacity:1;transform:scale(1.2);box-shadow:0 0 8px rgba(74,222,128,0.4)}
}

.notif-btn{
  margin-left:auto;
  background:none;
  border:1px solid var(--muted);
  color:var(--muted);
  font-family:inherit;
  font-size:10.5px;
  padding:4px 14px;
  cursor:pointer;
  border-radius:6px;
  transition:all 0.2s;
  letter-spacing:0.04em;
}

.notif-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(251,191,36,0.04)}
.notif-btn.on{border-color:var(--gold);color:var(--gold)}

/* ── Loading / Empty ── */

.loading{text-align:center;padding:80px 0;color:var(--dim);font-size:12px;position:relative;z-index:1}
.loading.hidden{display:none}
.blink{animation:blink 1s step-end infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
.empty{text-align:center;padding:80px 0;color:var(--dim);font-size:12px;position:relative;z-index:1}
.empty.hidden{display:none}

/* ── Toast ── */

.toast{
  position:fixed;
  bottom:64px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(251,191,36,0.1);
  color:var(--gold);
  padding:8px 24px;
  border-radius:12px;
  font-size:12px;
  font-weight:500;
  z-index:200;
  transition:opacity 0.35s,transform 0.35s;
  box-shadow:0 0 80px rgba(251,191,36,0.03);
}

.toast.hidden{opacity:0;transform:translateX(-50%) translateY(8px);pointer-events:none}

/* ── Scrollbar ── */

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

@media(max-width:480px){
  body{padding:20px 16px 10px}
  .clock-time{font-size:28px}
  .item-source{display:none}
  .item-tags{display:none}
}
</style>
</head>
<body>

<div id="stars"></div>
<div class="meteor meteor-1"></div>
<div class="meteor meteor-2"></div>
<div class="meteor meteor-3"></div>
<div class="meteor meteor-4"></div>

<div id="liveAlert" class="live-alert">
  <div class="live-alert-inner">
    <span class="live-dot"></span>
    <span class="live-label">Breaking</span>
    <span id="liveTitle" class="live-title"></span>
    <span id="liveSource" class="live-source"></span>
  </div>
</div>

<div class="clock-section">
  <div id="clocktime" class="clock-time">--:--:--</div>
  <div id="clockdate" class="clock-date"></div>
</div>

<div id="hero" class="hero"></div>

<div class="controls">
  <div class="filters">
    <button class="f-btn active" data-filter="all">All</button>
    <button class="f-btn" data-filter="cs">CS</button>
    <button class="f-btn" data-filter="ai">AI</button>
    <button class="f-btn" data-filter="ml">ML</button>
    <button class="f-btn" data-filter="startups">Startups</button>
  </div>
  <span class="ctrl-fill"></span>
  <span id="panelCount" class="story-count"></span>
</div>

<main>
  <div id="newsList" class="list"></div>
  <div id="loading" class="loading"><span class="blink">_</span> loading</div>
  <div id="empty" class="empty hidden">no stories</div>
</main>

<div class="status-bar">
  <span id="lastFetch" class="fetch-status">—</span>
  <button id="notifBtn" class="notif-btn">notifications</button>
</div>

<div id="toast" class="toast hidden"><span id="toastMsg"></span></div>

<script>
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=(s,p)=>(p||document).querySelector(s);
const $$=(s,p)=>Array.from((p||document).querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};

let state={articles:[],filtered:[],filter:'all',notif:false,loading:true,_lastFetch:null};

/* ── Starfield with natural clusters ── */

function createStars(){
  const c=$('#stars');
  const clusters=[
    {cx:15,cy:10,r:12,d:40},{cx:75,cy:8,r:8,d:25},{cx:45,cy:20,r:15,d:35},
    {cx:85,cy:65,r:10,d:20},{cx:10,cy:80,r:14,d:30},{cx:55,cy:85,r:9,d:22},
    {cx:30,cy:45,r:18,d:45},{cx:92,cy:40,r:7,d:18},{cx:60,cy:55,r:11,d:28},
  ];
  const stars=[];

  for(const cl of clusters){
    const n=cl.d||30;
    for(let i=0;i<n;i++){
      const ang=Math.random()*2*Math.PI;
      const dist=Math.random()*cl.r;
      stars.push({
        x:cl.cx+Math.cos(ang)*dist+((Math.random()-0.5)*3),
        y:cl.cy+Math.sin(ang)*dist+((Math.random()-0.5)*3),
      });
    }
  }

  for(let i=0;i<40;i++){
    stars.push({x:Math.random()*100,y:Math.random()*100});
  }

  for(const s of stars){
    if(s.x<0||s.x>100||s.y<0||s.y>100)continue;
    const el=document.createElement('div');
    el.className='star';
    const sz=0.3+Math.random()*1.6;
    el.style.width=sz+'px';el.style.height=sz+'px';
    el.style.left=s.x+'%';el.style.top=s.y+'%';
    el.style.setProperty('--d',(2+Math.random()*5)+'s');
    el.style.setProperty('--o1',String(0.08+Math.random()*0.2));
    el.style.setProperty('--o2',String(0.3+Math.random()*0.5));
    c.appendChild(el);
  }
}

/* ── Time ── */

function fmtTime(iso){
  const d=new Date(iso),s=(Date.now()-d)/1000;
  if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';
  if(s<604800)return Math.floor(s/86400)+'d';
  return pad(d.getMonth()+1)+'/'+pad(d.getDate());
}

function tick(){
  const n=new Date();
  const h=pad(n.getHours()),m=pad(n.getMinutes()),s=pad(n.getSeconds());
  $('#clocktime').textContent=h+':'+m+':'+s;
  $('#clockdate').textContent=n.getDate()+' '+MONTHS[n.getMonth()]+' '+n.getFullYear();
}

function srcShort(s){return s.length>10?s.substring(0,10):s}

function tagHTML(cats){
  const map={cs:'t-cs',ai:'t-ai',ml:'t-ml',startups:'t-sp'};
  return cats.map(c=>`<span class="tag ${map[c]||''}">${c.toUpperCase()}</span>`).join('');
}

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function getDayLabel(iso){
  const d=new Date(iso);
  const n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const y=new Date(t-86400000);
  const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((t-dd)/86400000);
  if(diff===0)return'Today';
  if(diff===1)return'Yesterday';
  if(d.getFullYear()===n.getFullYear())return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate();
  return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}

function rowHTML(a,isNew){
  return '<a class="item'+(isNew?' new':'')+'" data-id="'+a.id+'" href="'+a.url+'" target="_blank" rel="noopener noreferrer">'
    +'<span class="item-time">'+fmtTime(a.publishedAt)+'</span>'
    +'<span class="item-source">'+srcShort(a.source)+'</span>'
    +'<span class="item-title">'+a.title+'</span>'
    +'<span class="item-tags">'+tagHTML(a.categories)+'</span></a>';
}

const HERO_MAP={cs:'ht-cs',ai:'ht-ai',ml:'ht-ml',startups:'ht-sp'};

function heroCardHTML(a){
  const sum=a.summary?esc(a.summary).substring(0,200):'';
  return '<a class="hero-card" href="'+a.url+'" target="_blank" rel="noopener noreferrer">'
    +'<div class="item-title">'+a.title+'</div>'
    +'<div class="hero-card-bottom">'
    +'<span class="hero-badge">Breaking</span>'
    +'<span class="hero-src">'+srcShort(a.source)+'</span>'
    +a.categories.map(c=>'<span class="hero-tag '+(HERO_MAP[c]||'')+'">'+c.toUpperCase()+'</span>').join('')
    +'</div>'
    +(sum?'<div class="hero-preview">'
      +'<div class="hero-preview-head"><span class="hero-preview-label">Summary</span></div>'
      +sum+'</div>':'')
    +'</a>';
}

function render(animate){
  $('#loading').classList.add('hidden');
  $('#empty').classList.toggle('hidden',state.filtered.length>0);
  if(!state.filtered.length){$('#newsList').innerHTML='';return}
  const major=state.filtered.filter(a=>a.score>=20).slice(0,4);
  $('#hero').innerHTML=major.length?major.map(heroCardHTML).join(''):'';
  const normal=state.filtered.filter(a=>a.score<20);
  if(!normal.length){$('#newsList').innerHTML='';return}
  const exist=animate?new Set($$('.item',$('#newsList')).map(el=>el.dataset.id)):new Set();
  const byDay={};
  for(const a of normal){
    const lb=getDayLabel(a.publishedAt);
    if(!byDay[lb])byDay[lb]=[];
    byDay[lb].push(a);
  }
  const labels=Object.keys(byDay);
  let html='';
  for(const lb of labels){
    html+='<div class="day-header">'+lb+'</div>';
    for(const a of byDay[lb]){
      html+=rowHTML(a,animate&&!exist.has(a.id));
    }
  }
  $('#newsList').innerHTML=html;
}

function refreshTimes(){
  $$('.item').forEach(el=>{
    const a=state.articles.find(x=>x.id===el.dataset.id);
    if(a)el.querySelector('.item-time').textContent=fmtTime(a.publishedAt);
  });
}

function updateMeta(){
  const t=state.articles.length,s=state.filtered.length;
  $('.story-count').textContent=s+' stories';
}

function updateFetch(){
  if(state._lastFetch){
    const sec=Math.round((Date.now()-state._lastFetch)/1000);
    $('#lastFetch').textContent=sec<60?'updated '+sec+'s ago':'updated '+Math.floor(sec/60)+'m ago';
  }
}

async function fetchNews(){
  try{
    const url=state.filter==='all'?'/api/news':'/api/news?category='+state.filter;
    const res=await fetch(url);
    const data=await res.json();
    const prev=new Set(state.articles.map(a=>a.id));
    state.articles=data.articles;
    state._lastFetch=data.fetchedAt?new Date(data.fetchedAt).getTime():Date.now();
    if(state.filter==='all')state.filtered=[...state.articles];
    else state.filtered=state.articles.filter(a=>a.categories.some(c=>c.toLowerCase()===state.filter.toLowerCase()));
    const fresh=data.articles.some(a=>!prev.has(a.id));
    if(state.loading){state.loading=false;render(false)}
    else if(fresh){
      render(true);
      // Show live alert for the latest new article
      const latest=data.articles.filter(a=>!prev.has(a.id))[0];
      if(latest&&!state.loading){
        $('#liveTitle').textContent=latest.title;
        $('#liveSource').textContent=latest.source;
        $('#liveAlert').classList.add('visible');
        clearTimeout(window.la);
        window.la=setTimeout(()=>$('#liveAlert').classList.remove('visible'),4500);
      }
      $('#toastMsg').textContent='New stories';
      $('#toast').classList.remove('hidden');
      clearTimeout(window.tt);
      window.tt=setTimeout(()=>$('#toast').classList.add('hidden'),2500);
      if(state.notif&&document.hidden)try{new Notification('news',{body:'new stories'})}catch(e){}
    }
    updateMeta();updateFetch();
  }catch(e){if(state.loading)$('#loading').innerHTML='<span class="blink">_</span> failed'}
}

function handleFilter(cat){
  if(cat===state.filter)return;
  $$('.f-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===cat));
  state.filter=cat;fetchNews();
}

async function toggleNotif(){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted')state.notif=!state.notif;
  else state.notif=(await Notification.requestPermission())==='granted';
  $('#notifBtn').textContent=state.notif?'on':'notifications';
  $('#notifBtn').classList.toggle('on',state.notif);
}

function init(){
  createStars();
  $('#notifBtn').addEventListener('click',toggleNotif);
  $$('.f-btn').forEach(b=>b.addEventListener('click',()=>handleFilter(b.dataset.filter)));
  tick();setInterval(tick,1000);
  fetchNews();setInterval(fetchNews,10_000);setInterval(refreshTimes,10_000);setInterval(updateFetch,3_000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchNews()});
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
